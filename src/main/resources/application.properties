# Server Port configuration (Railway dynamic port support)
server.port=${PORT:8080}

# Database Connection (Works locally and on Railway using PGHOST/PGPORT/PGDATABASE/PGUSER/PGPASSWORD or DB_* fallbacks)
spring.datasource.url=jdbc:postgresql://${PGHOST:${DB_HOST:localhost}}:${PGPORT:${DB_PORT:5432}}/${PGDATABASE:${DB_NAME:url_shortener}}
spring.datasource.username=${PGUSER:${DB_USERNAME:postgres}}
spring.datasource.password=${PGPASSWORD:${DB_PASSWORD:postgres}}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Base URL for generated short URLs (defaults to http://localhost:8080 for local dev)
app.base-url=${APP_BASE_URL:http://localhost:8080}
